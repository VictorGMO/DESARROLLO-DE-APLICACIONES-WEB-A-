{% extends "base.html" %}

{% block title %}Panel de Administración - ElectroCasa{% endblock %}

{% block content %}

    <section class="py-5">
        <div class="container">
            <div class="text-center mb-5">
                <h2 class="section-title">Panel de Administración</h2>
                <p class="text-muted">Bienvenido, {{ current_user.usuario }}</p>
            </div>

            <div class="row g-4 justify-content-center">
                <div class="col-md-3 col-sm-6">
                    <a href="{{ url_for('productos') }}" class="text-decoration-none">
                        <div class="card h-100 text-center p-3">
                            <div class="card-body">
                                <i class="bi bi-box-seam card-icon"></i>
                                <h5 class="card-title">Productos</h5>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-3 col-sm-6">
                    <a href="{{ url_for('clientes') }}" class="text-decoration-none">
                        <div class="card h-100 text-center p-3">
                            <div class="card-body">
                                <i class="bi bi-people card-icon"></i>
                                <h5 class="card-title">Clientes</h5>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-3 col-sm-6">
                    <a href="{{ url_for('proveedores') }}" class="text-decoration-none">
                        <div class="card h-100 text-center p-3">
                            <div class="card-body">
                                <i class="bi bi-truck card-icon"></i>
                                <h5 class="card-title">Proveedores</h5>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-3 col-sm-6">
                    <a href="{{ url_for('facturacion') }}" class="text-decoration-none">
                        <div class="card h-100 text-center p-3">
                            <div class="card-body">
                                <i class="bi bi-receipt card-icon"></i>
                                <h5 class="card-title">Facturación</h5>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <div class="text-center mt-5">
                <a href="{{ url_for('registro') }}" class="btn btn-outline-primary">
                    <i class="bi bi-person-plus"></i> Registrar otro usuario
                </a>
            </div>
        </div>
    </section>

{% endblock %}
