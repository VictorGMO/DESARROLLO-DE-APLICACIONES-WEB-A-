<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Gestión de Inventario{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- estilos propios,ahora se cargan desde la carpeta static con url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- este es el base.html,aca van los elementos que se repiten en todas las paginas del sistema -->
    <!-- header,nav y footer ahora son componentes separados,se traen con include para no repetir el html -->

    <!-- aca empieza lo que seria el header -->
    <header>
        {% include "components/navbar.html" %}
    </header>
    <!-- aca termina el header -->

    <!-- de aca para abajo es el contenido que cambia segun la pagina -->
    <main>
        {% block content %}{% endblock %}
    </main>
    <!-- hasta aca llega el contenido dinamico -->

    {% include "components/footer.html" %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- cada pagina agrega su propio js si lo necesita,con este block -->
    {% block scripts %}{% endblock %}
</body>
</html>
