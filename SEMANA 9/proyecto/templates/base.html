<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Gestión de Inventario{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- estilos propios,ahora se cargan desde la carpeta static con url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- este es el base.html,aca van los elementos que se repiten en todas las paginas del sistema -->
    <!-- header,nav y footer quedan fijos,el contenido cambia con el block content -->

    <!-- aca empieza lo que seria el header -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
            <div class="container">
                <a class="navbar-brand" href="{{ url_for('index') }}">Gestión de Inventario</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('productos') }}">Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('clientes') }}">Clientes</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('proveedores') }}">Proveedores</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('facturacion') }}">Facturación</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <!-- aca termina el header -->

    <!-- de aca para abajo es el contenido que cambia segun la pagina -->
    <main>
        {% block content %}{% endblock %}
    </main>
    <!-- hasta aca llega el contenido dinamico -->

    <!-- esto seria el footer.html -->
    <footer class="py-4 text-center">
        <div class="container">
            <p class="mb-1"><strong>Desarrollado por:</strong> Victor Marcial Garofalo Orozco</p>
            <p class="mb-1"><strong>Asignatura:</strong> Desarrollo de Aplicaciones Web</p>
            <p class="mb-0"><strong>Año:</strong> 2026</p>
        </div>
    </footer>
    <!-- termina el footer -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- cada pagina agrega su propio js si lo necesita,con este block -->
    {% block scripts %}{% endblock %}
</body>
</html>
